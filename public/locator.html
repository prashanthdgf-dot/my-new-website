<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Dhanus Gold Fitness - Store Locator Plus</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background-color: #09090b;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      gmpx-store-locator {
        width: 100%;
        height: 100%;

        /* Customized dark luxury gold branding theme for Dhanus Gold Fitness */
        --gmpx-color-surface: #121215;
        --gmpx-color-on-surface: #f4f4f5;
        --gmpx-color-on-surface-variant: #a1a1aa;
        --gmpx-color-primary: #eab308;
        --gmpx-color-outline: #27272a;
        --gmpx-fixed-panel-width-row-layout: 28.5em;
        --gmpx-fixed-panel-height-column-layout: 65%;
        --gmpx-font-family-base: 'Inter', sans-serif;
        --gmpx-font-family-headings: 'Space Grotesk', sans-serif;
        --gmpx-font-size-base: 0.875rem;
        --gmpx-hours-color-open: #22c55e;
        --gmpx-hours-color-closed: #ef4444;
        --gmpx-rating-color: #facc15;
        --gmpx-rating-color-empty: #3f3f46;
      }
    </style>
    <script>
      const CONFIGURATION = {
        "locations": [
          {
            "title": "Dhanus Gold Fitness",
            "address1": "Hoysala Circle",
            "address2": "Kengeri Satellite Town, Bengaluru, Karnataka 560060, India",
            "coords": { "lat": 12.9247426, "lng": 77.4855608 },
            "placeId": "ChIJq-HoQjY_rjsRuCMhDrgVf8o"
          }
        ],
        "mapOptions": {
          "center": { "lat": 12.9247426, "lng": 77.4855608 },
          "fullscreenControl": true,
          "mapTypeControl": false,
          "streetViewControl": true,
          "zoom": 16,
          "zoomControl": true,
          "maxZoom": 19,
          "mapId": ""
        },
        "mapsApiKey": "REPLACE_WITH_YOUR_NEW_MAPS_API_KEY",
        "capabilities": {
          "input": true,
          "autocomplete": true,
          "directions": true,
          "distanceMatrix": true,
          "details": true,
          "actions": true
        }
      };
    </script>
    <script type="module">
      document.addEventListener('DOMContentLoaded', async () => {
        try {
          await customElements.whenDefined('gmpx-store-locator');
          const locator = document.querySelector('gmpx-store-locator');
          if (locator && typeof locator.configureFromQuickBuilder === 'function') {
            locator.configureFromQuickBuilder(CONFIGURATION);
          }
        } catch (e) {
          console.warn('Store locator initialization error:', e);
        }
      });
    </script>
  </head>
  <body>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/@googlemaps/extended-component-library/0.6.15/index.min.js"></script>

    <!-- Uses components from the Extended Component Library -->
    <gmpx-api-loader key="REPLACE_WITH_YOUR_NEW_MAPS_API_KEY" solution-channel="GMP_QB_locatorplus_v11_cABCDE"></gmpx-api-loader>
    <gmpx-store-locator map-id="DEMO_MAP_ID"></gmpx-store-locator>
  </body>
</html>
